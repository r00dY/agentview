packages:
  - "apps/api"
  - "apps/docs"
  - "apps/proxy"
  - "apps/tests"
  - "apps/webapp"
  - "apps/examples/*"
  - "packages/*"

overrides:
  zod: ^4.4.3
  react: ^19.1
  react-dom: ^19.1

patchedDependencies:
  ai@6.0.158: patches/ai@6.0.158.patch

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - protobufjs
  - sharp

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@better-auth/core@1.6.17'
  - '@better-auth/drizzle-adapter@1.6.17'
  - '@better-auth/kysely-adapter@1.6.17'
  - '@better-auth/memory-adapter@1.6.17'
  - '@better-auth/mongo-adapter@1.6.17'
  - '@better-auth/prisma-adapter@1.6.17'
  - '@better-auth/telemetry@1.6.17'
  - better-auth@1.6.17
